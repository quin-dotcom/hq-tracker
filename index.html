<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HQ Tracker</title>
<meta name="theme-color" content="#0b0b0b">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<style>
  html,body{margin:0;padding:0;height:100%;background:#fff;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbw_HfF1MKkNCACJR0jcEUVXnYHwNnt4R297kiWxHL9LU50IKDg_2veBqPc3jglTVpaW/exec" title="HQ Tracker" allow="clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
// Sign-in and invite links from the tracker's emails point here (https://tracker.hqenergy.ca/?t=...): pass the one-time link token on to the app frame,
// then drop it from the address bar so it isn't kept in history or bookmarks.
(function () {
  var m = /[?&]t=([a-f0-9]{1,80})(&|$)/i.exec(location.search);
  if (!m) return;
  var f = document.getElementById('app'); f.src = f.src + '?t=' + m[1];
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
})();
</script>
<script>
// Session bridge for HQ Tracker. The app runs in a Google Apps Script frame whose origin changes with each deployment,
// and Safari clears or partitions storage inside third-party frames, so the session token is kept here instead.
(function () {
  var KEY = 'hqtracker.session';
  function trusted(o) { try { var u = new URL(o); return u.protocol === 'https:' && /(^|\.)googleusercontent\.com$/.test(u.hostname); } catch (e) { return false; } }
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || typeof d !== 'object' || typeof d.hqTracker !== 'string' || !trusted(ev.origin) || !ev.source) return;
    try {
      if (d.hqTracker === 'getToken') ev.source.postMessage({ hqTracker: 'token', token: localStorage.getItem(KEY) || null }, ev.origin);
      else if (d.hqTracker === 'setToken' && typeof d.token === 'string' && d.token.length < 512) localStorage.setItem(KEY, d.token);
      else if (d.hqTracker === 'clearToken') localStorage.removeItem(KEY);
    } catch (e) {}
  });
})();
</script>
</body>
</html>
