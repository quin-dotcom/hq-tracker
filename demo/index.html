<title>HQ Tracker demo</title>
<meta name="robots" content="noindex">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* HQ Tracker. Black and white everywhere; gold (#E4B046) only marks what needs attention:
   overdue rebooks, queues and coaching gaps. 8px spacing grid; tap targets at least 48px. */
:root{--k:#0B0B0B;--w:#FFFFFF;--g:#E4B046;--g2:#FBF3E0;--line:#E7E7E9;--mute:#6B6B70;--soft:#F6F6F7;--max:1160px;--pad:16px;--shadow:0 1px 2px rgba(16,16,20,.05);--s1:8px;--s2:16px;--s3:24px;--s4:32px;--r:12px;--tap:48px;
  --silver:#BFC3C7;--bronze:#B08D57}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
html,body{margin:0;background:var(--soft);color:var(--k);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
@media (min-width:900px){:root{--pad:32px}}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--k);color:var(--w);padding-top:env(safe-area-inset-top)}
.top .bar{max-width:var(--max);margin:0 auto;display:flex;align-items:center;gap:var(--s2);padding:0 var(--pad);min-height:56px}
.top .logo{height:22px;width:auto;flex:none}
.top .who{margin-left:auto;font-size:14px;opacity:.85;display:flex;align-items:center;gap:var(--s1)}
.top .who button{background:none;border:1px solid #444;color:var(--w);border-radius:999px;min-height:40px;padding:0 var(--s2)}
.wrap{max-width:var(--max);margin:0 auto;padding:var(--s3) var(--pad);padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.rep .wrap,.rep .top .bar{max-width:640px} .rep .tabs .tabin{max-width:640px}
h1{font-size:24px;line-height:1.2;letter-spacing:-.01em;margin:0 0 var(--s2)} h2{font-size:17px;font-weight:650;margin:var(--s4) 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap} .h2s{font-size:13px;font-weight:500;color:var(--mute)}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s2);flex-wrap:wrap;margin:0 0 6px} .phead h1{margin:0} .phead .ctl{flex:0 1 380px;min-width:0}
.lede{color:var(--mute);font-size:14px;margin:0 0 var(--s3)} .phead + .lede{margin-top:2px}
@media (max-width:640px){.phead .ctl{flex:1 1 100%}}
.picker{display:grid;grid-template-columns:minmax(96px,2fr) minmax(0,3fr);gap:var(--s1)}
.ctlrow{display:flex;flex-wrap:wrap;gap:0 var(--s3)} .ctlrow .chips{margin-bottom:var(--s2)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s4);padding-top:var(--s2);border-top:1px solid var(--line);font-size:13px;color:var(--mute)} h3{font-size:16px;margin:0 0 var(--s1)}
.sub{color:var(--mute);font-size:14px}
